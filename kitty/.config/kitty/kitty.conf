# kitty is the outer terminal for herdr. Its job here is narrow: draw text
# fast and speak the graphics protocol so images render inside nvim.
# Panes, tabs and sessions are herdr's business, not kitty's.

font_family      FiraCode Nerd Font Mono
font_size        11.0

# Nerd Font glyphs are already in the family above; don't let kitty
# substitute another font for them and break alignment.
disable_ligatures never

scrollback_lines 10000

# herdr draws its own tab bar and status UI, so kitty's would be a
# second, redundant row.
hide_window_decorations no
tab_bar_style          hidden

enable_audio_bell no
