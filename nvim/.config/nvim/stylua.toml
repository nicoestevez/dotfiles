# Formatting rules for this config (used by conform.nvim via stylua).
# Pinned here so every machine formats the same way; without it the
# lsp_format fallback would pick up the editor's shiftwidth (4) instead.
column_width = 120
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
